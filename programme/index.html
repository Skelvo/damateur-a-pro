<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Programme">
<meta name="theme-color" content="#0a110f">
<title>Programme Tribune</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a110f;--bg2:#0e1714;--card:#121c19;--card2:#18251f;--line:#22342d;--line2:#2d4339;--ink:#edf3ef;--mute:#8ea198;--acc:#35d07f;--sel:#ffd23f;--loss:#ff5a5f;--blue:#5fb4ff;--org:#ff9f43;--pur:#b48cff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 15px/1.4 Barlow,system-ui,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 30px);max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hd{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.hd img{height:30px}
.hd h1{flex:1;font:800 26px/1 "Barlow Condensed";letter-spacing:.02em;text-transform:uppercase}
.hd h1 small{display:block;font:600 12px Barlow;color:var(--mute);letter-spacing:0;text-transform:none;margin-top:3px}
.rf{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.rf svg{width:20px;height:20px}.rf.spin svg{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center}
.sum b{display:block;font:800 26px/1 "Barlow Condensed"}
.sum small{display:block;font:600 11px/1.15 Barlow;color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px 0;border-radius:10px;font:700 14px Barlow;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.day{font:800 15px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px;display:flex;justify-content:space-between}
.day.today{color:var(--acc)}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.it.err{border-color:#ff5a5f88}
.row{display:flex;gap:12px;padding:11px;width:100%;text-align:left;align-items:center}
.th{flex:none;width:56px;height:70px;border-radius:10px;background:var(--bg2) center/cover no-repeat;border:1px solid var(--line2);position:relative;display:grid;place-items:center;font-size:24px}
.th.story,.th.reel{width:46px;height:82px}
.th .n{position:absolute;right:3px;bottom:3px;font:700 10px Barlow;background:#000a;border-radius:6px;padding:1px 5px}
.th .play{position:absolute;inset:0;display:grid;place-items:center}.th .play i{width:24px;height:24px;border-radius:50%;background:#000a;display:grid;place-items:center}
.mid{flex:1;min-width:0}
.mid .t{display:flex;align-items:center;gap:8px;font:800 20px/1 "Barlow Condensed"}
.mid .t small{font:600 12px Barlow;color:var(--mute)}
.mid .l{font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tag{font:700 11px Barlow;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line2);color:var(--mute)}
.st{font:700 11px Barlow;padding:2px 8px;border-radius:20px}
.st.approved{background:#35d07f22;color:#8ff0bd}.st.published,.st.manual_done{background:#35d07f;color:#04170d}
.st.draft{background:#ffd23f26;color:var(--sel)}.st.error{background:#ff5a5f26;color:#ff9a9d}.st.publishing{background:#5fb4ff26;color:var(--blue)}
.st.planned{background:#5fb4ff1f;color:var(--blue)}.st.manual{background:#ff9f4326;color:var(--org)}.st.external{background:#b48cff22;color:var(--pur)}
.net{width:18px;height:18px;border-radius:5px;display:grid;place-items:center}
.net svg{width:12px;height:12px}
.net.ig{background:linear-gradient(45deg,#f9a825,#e91e63 55%,#7b1fa2)}.net.fb{background:#1877f2}
.chev{flex:none;color:var(--mute);transition:transform .2s}.it.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 11px 12px}.it.open .body{display:block}
.media{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.media img,.media video{flex:none;scroll-snap-align:start;max-height:420px;max-width:86%;border-radius:12px;border:1px solid var(--line2);background:#000}
.cap{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap h4{display:flex;justify-content:space-between;align-items:center;font:700 12px Barlow;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.cap h4 button{font:700 12px Barlow;color:var(--acc);text-transform:none;letter-spacing:0}
.cap p{white-space:pre-wrap;font-size:14px}
.note{margin-top:10px;font-size:14px;color:#dfe9e3;background:var(--bg2);border-left:3px solid var(--blue);border-radius:8px;padding:9px 11px;white-space:pre-wrap}
.note.m{border-color:var(--org)}.note.x{border-color:var(--pur)}.note.e{border-color:var(--loss);color:#ffb3b5}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px 10px;border-radius:12px;font:800 16px "Barlow Condensed";letter-spacing:.03em;text-transform:uppercase;text-align:center}
.btn.g{background:var(--acc);color:#04170d}.btn.y{background:var(--sel);color:#1b1400}.btn.gh{background:var(--card2);border:1px solid var(--line2)}.btn.r{background:#ff5a5f22;color:#ff9a9d}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.keyb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:30px}
.keyb h2{font:800 24px "Barlow Condensed";text-transform:uppercase}
.keyb p{color:var(--mute);margin:8px 0 14px}
.keyb input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font:600 15px Barlow}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:24px}
.pin{max-width:340px;margin:40px auto 0;text-align:center}
.pin h2{font:800 26px "Barlow Condensed";text-transform:uppercase}
.pin p{color:var(--mute);margin:6px 0 22px;min-height:21px}.pin p.bad{color:#ff9a9d}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2)}.dots i.on{background:var(--acc);border-color:var(--acc)}
.dots.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button{height:72px;border-radius:20px;background:var(--card);border:1px solid var(--line);font:800 32px "Barlow Condensed";transition:background .08s,transform .08s}
.pad button.hit{background:var(--card2);transform:scale(.94)}.pad .ok{background:var(--acc);color:#04170d;border:0;font-size:18px}.pad .del{font-size:20px;color:var(--mute)}
.link{color:var(--acc);font:700 13px Barlow;margin-top:18px}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);max-width:616px;margin:0 auto;display:none;align-items:center;gap:10px;background:var(--sel);color:#1b1400;border-radius:16px;padding:10px 10px 10px 16px;font:700 14px Barlow;box-shadow:0 10px 30px #0008;z-index:9}
.upd.on{display:flex}.upd span{flex:1}.upd button{background:#1b1400;color:var(--sel);border-radius:10px;padding:8px 12px;font:800 14px "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase}
.cov{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.cov img{width:84px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;border:1px solid var(--line2);background:#000;flex:none}
.cov .ct{flex:1;min-width:0}.cov h4{font:700 12px Barlow;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.cov p{font-size:13px;color:#cfdad4;margin:4px 0 8px}.cov .acts{margin-top:0;flex-wrap:wrap}.cov .btn{font-size:14px;padding:9px 8px}
.modal{position:fixed;inset:0;background:#000d;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);gap:12px}
.modal video{max-height:62vh;max-width:100%;border-radius:14px;background:#000;aspect-ratio:9/16}
.modal input[type=range]{width:100%;max-width:420px;accent-color:#ffd23f}
.modal .acts{width:100%;max-width:420px}.modal p{color:var(--mute);font-size:13px;text-align:center}
.how{margin-top:10px;background:#ff9f430f;border:1px solid #ff9f4355;border-radius:14px;padding:12px}
.how h4{font:800 13px Barlow;color:var(--org);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.how ol{margin:0 0 4px 18px;padding:0;font-size:14px;line-height:1.45}.how ol li{margin-bottom:4px}
.kv{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.kv .l{flex:none;width:74px;font:700 11px Barlow;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kv .v{flex:1;min-width:0;font-weight:700;font-size:14px;word-break:break-word}
.kv button{flex:none;font:800 12px Barlow;color:var(--acc);padding:4px 6px}
.how .sub{font:800 12px Barlow;color:#fff;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.dl{display:block;text-align:center;margin-top:10px;color:var(--ink);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:10px 16px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head><body>
<div class="hd"><img src="../logo-tribune.png" alt=""><h1>Programme<small id="sub">Instagram et Facebook</small></h1>
  <button class="rf" id="rf" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="upd" id="updb"><span>Nouvelle version du programme</span><button onclick="location.reload()">Recharger</button></div>
<script>
const $=s=>document.querySelector(s);
const TZ="Europe/Paris",PV="6";
// nouvelle version en ligne ? (vérifié à l'ouverture et toutes les 2 minutes)
async function checkV(){try{const v=(await (await fetch("version.txt?t="+Date.now(),{cache:"no-store"})).text()).trim();if(v&&v!==PV)$("#updb").classList.add("on")}catch(e){}}
let KEY="",DATA=null,TAB="next",OPEN=new Set(),PIN="";
try{PIN=sessionStorage.getItem("progpin")||""}catch(e){}
try{const u=new URL(location.href),k=u.searchParams.get("k");if(k){KEY=k;localStorage.setItem("progk",k)}else KEY=localStorage.getItem("progk")||""}catch(e){}
const ST={approved:"Programmé",publishing:"En cours…",published:"Publié ✓",draft:"À valider",error:"Erreur",planned:"Je prépare",manual:"À faire par toi",manual_done:"Fait ✓",external:"Metricool"};
const KIND={post:"Post",story:"Story",carousel:"Carrousel",reel:"Reel"};
const IG='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>';
const FB='<svg viewBox="0 0 24 24"><path fill="#fff" d="M14 8h3V4h-3c-2.8 0-4 1.8-4 4.3V10H7v4h3v7h4v-7h3l1-4h-4V8.6c0-.4.2-.6.6-.6z"/></svg>';
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(t,o)=>new Intl.DateTimeFormat("fr-FR",{timeZone:TZ,...o}).format(new Date(t));
const dayKey=t=>fmt(t,{year:"numeric",month:"2-digit",day:"2-digit"});
function rel(t){const d=t-Date.now(),a=Math.abs(d),m=Math.round(a/6e4),h=Math.round(a/36e5),j=Math.round(a/864e5);
  const s=m<60?`${m} min`:h<36?`${h} h`:`${j} j`;return d>0?`dans ${s}`:`il y a ${s}`}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
async function api(action,data={}){const r=await fetch("/api/game",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,k:KEY,pin:PIN,...data})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Object.assign(new Error(j.error||r.status),{code:j.error||r.status});return j}
let SIG="";
function tick(){document.querySelectorAll("[data-rel]").forEach(e=>{const t=+e.dataset.rel;e.textContent=(e.dataset.pub?"publié ":"")+rel(t)});const u=$("#upd");if(u)u.textContent=fmt(Date.now(),{hour:"2-digit",minute:"2-digit"})}
async function load(manual){if(PADMODE)return;if(manual)$("#rf").classList.add("spin");try{const d=await api("social_board"),sig=JSON.stringify(d.posts);DATA=d;if(sig!==SIG||!document.querySelector(".tabs")){SIG=sig;render()}else tick()}catch(e){if(e.code==="forbidden"){KEY="";try{localStorage.removeItem("progk")}catch(x){}renderKey(true)}
  else if(e.code==="pin_setup")pinPad("setup");else if(e.code==="pin_needed")pinPad("enter");else if(e.code==="pin_bad"){setPin("");pinPad("enter","Code incorrect")}
  else if(e.code==="pin_locked"){setPin("");pinPad("enter","Trop d’essais : réessaie dans 15 minutes")}else{toast("Pas de connexion, réessaie");if(!DATA)$("#app").innerHTML='<div class="empty">Impossible de charger le programme.</div>'}}finally{$("#rf").classList.remove("spin")}}
// ---- code en chiffres ----
let PADMODE=null;
function setPin(v){PIN=v;try{v?sessionStorage.setItem("progpin",v):sessionStorage.removeItem("progpin")}catch(e){}}
// la longueur du code est retenue sur le téléphone : dès le dernier chiffre tapé, ça valide tout seul (pas de OK)
const plen=()=>{try{return+localStorage.getItem("progpinlen")||0}catch(e){return 0}};
const setPlen=n=>{try{localStorage.setItem("progpinlen",n)}catch(e){}};
function pinPad(mode,msg,first,old){PADMODE=mode;DATA=null;SIG="";let v="",busy=false;
  const T={setup:["Choisis ton code","4 à 6 chiffres, puis OK."],confirm:["Confirme ton code","Tape-le une seconde fois."],enter:["Ton code","Pour ouvrir le programme."],old:["Code actuel","Pour le changer, tape d’abord l’actuel."],"new":["Nouveau code","4 à 6 chiffres, puis OK."],confirm2:["Confirme le nouveau code","Tape-le une seconde fois."]}[mode];
  // longueur attendue : connue → validation automatique ; sinon (choix d'un code) → bouton OK
  const want=mode==="confirm"||mode==="confirm2"?first.length:mode==="enter"||mode==="old"?plen():0;
  $("#app").innerHTML=`<div class="pin"><h2>${T[0]}</h2><p class="${msg?"bad":""}" id="pmsg">${msg||(want?T[1].replace(", puis OK",""):T[1])}</p><div class="dots" id="dots"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del" aria-label="Effacer">⌫</button><button data-k="0">0</button>${want?`<button class="del" data-k="clr" aria-label="Tout effacer">✕</button>`:`<button class="ok" data-k="ok">OK</button>`}</div>
    ${mode==="old"||mode==="new"||mode==="confirm2"?`<button class="link" data-k="cancel">Annuler</button>`:""}</div>`;
  const dots=()=>{$("#dots").innerHTML=Array.from({length:Math.max(want||4,v.length)},(_, i)=>`<i class="${i<v.length?"on":""}"></i>`).join("")};dots();
  const bad=t=>{$("#pmsg").textContent=t;$("#pmsg").className="bad";$("#dots").classList.remove("shake");void $("#dots").offsetWidth;$("#dots").classList.add("shake");v="";dots()};
  async function submit(){if(v.length<4){bad("Au moins 4 chiffres");return}busy=true;
    if(mode==="setup"||mode==="new"){setTimeout(()=>pinPad(mode==="setup"?"confirm":"confirm2",null,v,old),120);return}
    if(mode==="confirm"||mode==="confirm2"){if(v!==first){busy=false;bad("Les deux codes sont différents");return}
      try{await api("social_pin_set",{pin:v,old:old||""});setPin(v);setPlen(v.length);PADMODE=null;toast(mode==="confirm"?"Code enregistré ✓":"Code changé ✓");load()}catch(x){busy=false;bad(x.code==="pin_bad"?"Code actuel incorrect":"Erreur, réessaie")}return}
    if(mode==="old"){setTimeout(()=>pinPad("new",null,null,v),120);return}
    setPin(v);setPlen(v.length);PADMODE=null;setTimeout(load,80)}
  function press(k){if(busy)return;
    if(k==="cancel"){PADMODE=null;load();return}
    if(k==="del"){v=v.slice(0,-1);dots();return}
    if(k==="clr"){v="";dots();return}
    if(k==="ok"){submit();return}
    if(v.length>=(want||6))return;v+=k;dots();
    if(want&&v.length===want)submit();else if(!want&&v.length===6)submit()}
  // au toucher (plus rapide que le « clic » qui attend qu'on relâche)
  $(".pin").onpointerdown=e=>{const b=e.target.closest("[data-k]");if(!b)return;e.preventDefault();b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),110);press(b.dataset.k)};
  // clavier d'ordinateur
  document.onkeydown=e=>{if(!PADMODE)return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Enter"&&!want)press("ok")}}
function renderKey(bad){$("#app").innerHTML=`<div class="keyb"><h2>Ta clé d’accès</h2><p>${bad?"Cette clé ne marche pas. ":""}Ouvre le lien que Claude t’a donné, ou colle ta clé ici.</p><input id="kin" placeholder="Colle ta clé" autocomplete="off"><div class="acts"><button class="btn g" id="kok">Ouvrir le programme</button></div></div>`;
  $("#kok").onclick=()=>{KEY=$("#kin").value.trim();try{localStorage.setItem("progk",KEY)}catch(e){}load()}}
function thumb(p){const im=p.kind==="reel"?(p.cover||""):p.kind==="carousel"&&p.images?p.images[0]:(/\.(png|jpe?g)$/i.test(p.image)?p.image:"");
  const em={planned:"🛠️",manual:"✋",external:"🗓️"}[p.status]||"🖼️";
  return`<div class="th ${p.kind}" ${im?`style="background-image:url('${esc(im)}')"`:""}>${im?"":em}${p.kind==="carousel"&&p.images?`<span class="n">1/${p.images.length}</span>`:""}${p.kind==="reel"?`<span class="play"><i><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#fff"/></svg></i></span>`:""}</div>`}
function media(p){if(p.kind==="reel"&&p.image)return`<div class="media"><video src="${esc(p.image)}" ${p.cover?`poster="${esc(p.cover)}"`:""} controls playsinline preload="none"></video></div>`;
  const L=p.kind==="carousel"&&p.images?p.images:/\.(png|jpe?g)$/i.test(p.image)?[p.image]:[];
  return L.length?`<div class="media">${L.map(u=>`<img src="${esc(u)}" loading="lazy" alt="">`).join("")}</div>`:""}
function card(p){const o=OPEN.has(p.id),nets=(p.networks||[]);
  const note=p.status==="planned"?`<div class="note">🛠️ Claude prépare cette publication. Tu la verras ici en « À valider » quand elle sera prête.${p.caption_ig?"\n\n"+esc(p.caption_ig):""}</div>`
    :p.status==="manual"||p.status==="manual_done"?`<div class="note m">✋ À poster toi-même${p.caption_ig?" :\n"+esc(p.caption_ig):"."}</div>`
    :p.status==="external"?`<div class="note x">🗓️ Programmé dans Metricool (rien à faire ici).${p.caption_ig?"\n"+esc(p.caption_ig):""}</div>`:"";
  const H=p.howto||null;let how="";
  if(H&&(p.status==="manual"||p.status==="manual_done")){const cp=v=>`<button data-cp="${esc(v)}">Copier</button>`;
    how=`<div class="how"><h4>✋ À faire par toi</h4>${H.steps&&H.steps.length?`<ol>${H.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}`
      +(H.poll?`<div class="sub">📊 Sticker sondage</div><div class="kv"><span class="l">Question</span><span class="v">${esc(H.poll.q)}</span>${cp(H.poll.q)}</div>${H.poll.opts.map((o,i)=>`<div class="kv"><span class="l">Réponse ${i+1}</span><span class="v">${esc(o)}</span>${cp(o)}</div>`).join("")}`:"")
      +(H.link?`<div class="sub">🔗 Sticker lien</div><div class="kv"><span class="l">Lien</span><span class="v">${esc(H.link.url)}</span>${cp(H.link.url)}</div><div class="kv"><span class="l">Étiquette</span><span class="v">${esc(H.link.label)}</span>${cp(H.link.label)}</div>`:"")
      +(p.image?`<a class="btn gh dl" href="${esc(p.image)}" target="_blank" rel="noopener">⬇︎ Ouvrir l’image pour l’enregistrer</a>`:"")+`</div>`}
  const caps=["planned","manual","manual_done","external"].includes(p.status)?"":[["Instagram",p.caption_ig],["Facebook",p.caption_fb]].filter(x=>x[1]).map(([n,t],i)=>`<div class="cap"><h4>Texte ${n}<button data-copy="${p.id}:${i}">Copier</button></h4><p>${esc(t)}</p></div>`).join("");
  const acts=p.status==="draft"?`<div class="acts"><button class="btn g" data-op="approve" data-id="${p.id}">✓ Valider</button><button class="btn r" data-op="cancel" data-id="${p.id}">Annuler</button></div>`
    :p.status==="approved"?`<div class="acts"><button class="btn gh" data-op="unapprove" data-id="${p.id}">Remettre en brouillon</button></div>`
    :p.status==="manual"?`<div class="acts"><button class="btn y" data-op="done" data-id="${p.id}">✓ C’est posté</button></div>`
    :p.status==="manual_done"?`<div class="acts"><button class="btn gh" data-op="undone" data-id="${p.id}">Pas encore fait</button></div>`:"";
  const cov=p.kind!=="reel"?"":`<div class="cov">${p.cover?`<img src="${esc(p.cover)}" alt="">`:`<img alt="">`}<div class="ct"><h4>Couverture</h4><p>${p.cover?"L’image affichée sur ton profil avant qu’on lance la vidéo. Garde l’essentiel au centre.":"Pas encore choisie : Instagram prendra la 1re image de la vidéo."}</p>${["draft","approved","planned","error"].includes(p.status)?`<div class="acts"><button class="btn gh" data-cov="${p.id}" data-mode="frame">Image de la vidéo</button><button class="btn gh" data-cov="${p.id}" data-mode="file">Importer</button></div>`:""}</div></div>`;
  return`<div class="it${o?" open":""}${p.status==="error"?" err":""}" data-it="${p.id}"><button class="row" data-tog="${p.id}">${thumb(p)}
    <div class="mid"><div class="t">${fmt(p.at,{hour:"2-digit",minute:"2-digit"})}<small ${p.status==="published"&&p.published_at?`data-rel="${p.published_at}" data-pub="1"`:`data-rel="${p.at}"`}>${p.status==="published"&&p.published_at?"publié "+rel(p.published_at):rel(p.at)}</small></div>
      <div class="l">${esc(p.label||KIND[p.kind])}</div>
      <div class="tags"><span class="st ${p.status}">${ST[p.status]||p.status}</span><span class="tag">${KIND[p.kind]||p.kind}</span>${nets.includes("instagram")?`<span class="net ig">${IG}</span>`:""}${nets.includes("facebook")?`<span class="net fb">${FB}</span>`:""}</div></div>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="body">${p.status==="error"&&p.error?`<div class="note e">⚠️ ${esc(p.error)}</div>`:""}${o?media(p):""}${H&&(p.status==="manual"||p.status==="manual_done")?"":note}${how}${cov}${caps}${acts}</div></div>`}
function render(){if(!DATA)return;const now=Date.now(),t0=new Date(fmt(now,{year:"numeric",month:"2-digit",day:"2-digit"}).split("/").reverse().join("-")+"T00:00:00").getTime()-36e5*3;
  const P=DATA.posts.map(p=>({...p,id:String(p.id),at:+p.at,published_at:p.published_at&&+p.published_at}));
  const done=p=>["published","manual_done"].includes(p.status)||(p.status==="external"&&p.at<now-36e5);
  const next=P.filter(p=>!done(p)).sort((a,b)=>a.at-b.at),past=P.filter(done).sort((a,b)=>b.at-a.at);
  const c=s=>P.filter(p=>p.status===s).length;
  const L=TAB==="next"?next:past;let h=`<div class="sum"><div><b style="color:var(--acc)">${c("approved")}</b><small>Programmés</small></div><div><b style="color:var(--sel)">${c("draft")}</b><small>À valider</small></div><div><b style="color:var(--org)">${c("manual")}</b><small>À faire par toi</small></div><div><b style="color:var(--blue)">${c("planned")}</b><small>Je prépare</small></div></div>
    <div class="tabs"><button data-tab="next" aria-pressed="${TAB==="next"}">À venir (${next.length})</button><button data-tab="past" aria-pressed="${TAB==="past"}">Publié (${past.length})</button></div>`;
  if(!L.length)h+=`<div class="empty">${TAB==="next"?"Rien de prévu pour l’instant.":"Rien de publié pour l’instant."}</div>`;
  let last="";const today=dayKey(now),tom=dayKey(now+864e5);
  for(const p of L){const k=dayKey(p.at);if(k!==last){last=k;const lab=k===today?"Aujourd’hui":k===tom?"Demain":fmt(p.at,{weekday:"long",day:"numeric",month:"long"});
      const n=L.filter(x=>dayKey(x.at)===k).length;h+=`<div class="day${k===today?" today":""}"><span>${lab}</span><span>${n}</span></div>`}h+=card(p)}
  h+=`<div class="foot">Heure de Paris · mis à jour à <span id="upd">${fmt(now,{hour:"2-digit",minute:"2-digit"})}</span><br><button class="link" id="chg">Changer mon code</button> · <button class="link" id="lock">Verrouiller</button></div>`;
  $("#app").innerHTML=h;$("#chg").onclick=()=>pinPad("old");$("#lock").onclick=()=>{setPin("");pinPad("enter")};$("#sub").textContent=c("error")?`⚠️ ${c("error")} erreur${c("error")>1?"s":""} à regarder`:"Instagram et Facebook"}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tab],[data-tog],[data-op],[data-copy],[data-cov],[data-cp]");if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;render();return}
  if(t.dataset.copy){const[id,i]=t.dataset.copy.split(":"),p=DATA.posts.find(x=>String(x.id)===id);try{await navigator.clipboard.writeText(i==="0"?p.caption_ig:p.caption_fb);toast("Texte copié")}catch(x){toast("Copie impossible")}return}
  if(t.dataset.tog){const id=t.dataset.tog;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render();return}
  if(t.dataset.cp!=null){try{await navigator.clipboard.writeText(t.dataset.cp);toast("Copié ✓")}catch(x){toast("Copie impossible")}return}
  if(t.dataset.cov){const p=DATA.posts.find(x=>String(x.id)===t.dataset.cov);if(t.dataset.mode==="file")pickFile(p);else pickFrame(p);return}
  if(t.dataset.op){const op=t.dataset.op;if(op==="cancel"&&!confirm("Annuler cette publication ?"))return;t.disabled=true;
    try{const j=await api("social_act",{id:t.dataset.id,op});SIG="";toast(j.ok?{approve:"Validé : ça partira tout seul ✓",unapprove:"Remis en brouillon",cancel:"Annulé",done:"Noté, merci !",undone:"Remis à faire"}[op]:"Déjà changé, je recharge");await load()}catch(x){toast("Erreur, réessaie");t.disabled=false}}});
// ---- couverture des Reels ----
function toJpeg(src,sw,sh){const c=document.createElement("canvas");c.width=1080;c.height=1920;const x=c.getContext("2d");
  const r=Math.max(1080/sw,1920/sh),w=sw*r,h=sh*r;x.fillStyle="#000";x.fillRect(0,0,1080,1920);x.drawImage(src,(1080-w)/2,(1920-h)/2,w,h);return c.toDataURL("image/jpeg",.9)}
async function saveCover(p,data){try{const j=await api("social_cover",{id:p.id,image:data});if(!j.ok)throw 0;toast("Couverture enregistrée ✓");SIG="";load()}catch(e){toast("Impossible d’enregistrer la couverture")}}
function pickFile(p){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const d=toJpeg(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(u);saveCover(p,d)};im.src=u};i.click()}
function pickFrame(p){const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<p>Fais glisser pour choisir l’image de couverture</p><video src="${esc(p.image)}" playsinline muted preload="auto"></video><input type="range" min="0" max="100" step="0.1" value="0"><div class="acts"><button class="btn gh" data-x="no">Annuler</button><button class="btn y" data-x="ok">Utiliser cette image</button></div>`;
  document.body.appendChild(m);const v=m.querySelector("video"),r=m.querySelector("input");
  v.addEventListener("loadedmetadata",()=>{r.max=v.duration;v.play().then(()=>v.pause()).catch(()=>{});v.currentTime=Math.min(1,v.duration/10);r.value=v.currentTime});
  r.oninput=()=>{v.currentTime=+r.value};
  m.onclick=e=>{const b=e.target.closest("[data-x]");if(!b)return;if(b.dataset.x==="ok"){if(!v.videoWidth){toast("La vidéo charge encore…");return}saveCover(p,toJpeg(v,v.videoWidth,v.videoHeight))}m.remove()}}
$("#rf").onclick=()=>load(true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkV();if(KEY)load()}});setInterval(()=>{if(KEY&&!document.hidden)load()},60000);setInterval(checkV,120000);checkV();
if(KEY)load();else renderKey(false);
</script>
