# Réveille le serveur toutes les 5 minutes : notifications de paris et publications Instagram/Facebook programmées
# (« ton match commence », « pari gagné / perdu »). L'offre gratuite de Vercel ne permet qu'une tâche par jour.
name: Notifications de paris
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier les paris en cours
        run: curl -fsS --max-time 60 "https://damateur-a-pro.vercel.app/api/game?cron=1&slot=tick" || true
