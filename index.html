  toast(`${ic("target")} Défi réussi : « ${esc(d.t)} ». Récupère +${d.r} dans l’onglet Matchs.`,"win")}}

/* ---------- roue de la chance ----------
   8 cases, chacune exactement 1 chance sur 8 : tirage uniforme avec le générateur
   aléatoire cryptographique du navigateur (rejet des valeurs biaisées). */
const WHEEL=[25,50,75,100,150,200,300,500],WCOL=["#35d07f","#ffd23f","#ff7a45","#5fa8ff","#d7f25a","#c084fc","#ff5a5f","#f8fafc"];
function fairIndex(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function wheelSvg(){const n=WHEEL.length,st=360/n,R=140,c=150,pt=d=>{const r=(d-90)*Math.PI/180;return(c+R*Math.cos(r)).toFixed(2)+" "+(c+R*Math.sin(r)).toFixed(2)};
  return`<svg viewBox="0 0 300 300" class="wheel" id="wheel" aria-hidden="true">${WHEEL.map((v,i)=>{const a0=i*st-st/2,a1=a0+st,dark=lum(WCOL[i])>.55;
    return`<path d="M150 150L${pt(a0)}A${R} ${R} 0 0 1 ${pt(a1)}Z" fill="${WCOL[i]}" stroke="#0a110f" stroke-width="3"/>
    <g transform="rotate(${i*st} 150 150)"><text x="150" y="52" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="30" fill="${dark?"#0a110f":"#fff"}">${v}</text>
    <text x="150" y="72" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700" font-size="11" fill="${dark?"#0a110f":"#fff"}" opacity=".75">JETONS</text></g>`}).join("")}
    <circle cx="150" cy="150" r="141" fill="none" stroke="#ffd23f" stroke-width="6"/>
    ${Array.from({length:n},(_,i)=>{const r=(i*st+st/2-90)*Math.PI/180;return`<circle cx="${(150+141*Math.cos(r)).toFixed(1)}" cy="${(150+141*Math.sin(r)).toFixed(1)}" r="4.5" fill="#fff"/>`}).join("")}
    <circle cx="150" cy="150" r="26" fill="#0a110f" stroke="#ffd23f" stroke-width="5"/></svg>`}
function wheelMini(){return`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">${WCOL.map((col,i)=>{const a0=(i*45-112.5)*Math.PI/180,a1=a0+Math.PI/4;
  return`<path d="M12 12L${(12+11*Math.cos(a0)).toFixed(2)} ${(12+11*Math.sin(a0)).toFixed(2)}A11 11 0 0 1 ${(12+11*Math.cos(a1)).toFixed(2)} ${(12+11*Math.sin(a1)).toFixed(2)}Z" fill="${col}"/>`}).join("")}<circle cx="12" cy="12" r="11" fill="none" stroke="#2a1d00" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="#2a1d00"/></svg>`}
function nextReset(){const d=new Date();d.setHours(24,0,0,0);const m=Math.round((d-Date.now())/6e4);return(m>=60?Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"):m+" min")}
function viewWheel(){const done=S.bonus===today();
  return`<div class="grab"><h3>Roue de la chance</h3><button class="x" data-act="close" aria-label="Fermer">${ic("x")}</button></div>
  <div class="wheelbox"><div class="pointer"></div>${wheelSvg()}</div>
  <div id="wres" class="wres">${done&&S.wheel&&S.wheel.d===today()?`Aujourd’hui : <b>+${tok(S.wheel.v)} jetons</b>`:"Un tour gratuit par jour"}</div>
  <button class="btn gold wide" data-act="spin" id="spin" ${done?"disabled":""}>${done?"Prochain tour dans "+nextReset():"Lancer la roue"}</button>
  <div class="info">${ic("info")}<span><b style="color:var(--ink)">100 % hasard.</b> Les 8 cases ont exactement la même chance : 1 sur 8, soit 12,5 % chacune. Le tirage utilise le générateur aléatoire sécurisé du téléphone, sans aucun réglage caché.</span></div>`}
let spinning=false;
function spin(){if(spinning||S.bonus===today())return;spinning=true;
  const i=fairIndex(WHEEL.length),v=WHEEL[i];
  // le gain est enregistré tout de suite (recharger la page ne permet pas de relancer)
  S.bonus=today();S.wheel={d:today(),v};S.bal+=v;S.peak=Math.max(S.peak,S.bal);save();if(v>=200)postAct("wheel",{v});
  const w=$("#wheel"),b=$("#spin"),jit=(Math.random()-.5)*(360/WHEEL.length)*.7,deg=360*7-i*(360/WHEEL.length)+jit;
  if(b){b.disabled=true;b.textContent="Ça tourne…"}
  const end=()=>{spinning=false;$("#bal").textContent=tok(S.bal);bump();
    if($("#wres"))$("#wres").innerHTML=`Gagné : <b>+${tok(v)} jetons</b>`;if($("#spin"))$("#spin").textContent="Prochain tour dans "+nextReset();
    toast(`${wheelMini()} +${tok(v)} jetons ! À demain pour un nouveau tour.`,"win");if(v>=200)confetti();if(!U.open)render()};
  if(!w||matchMedia("(prefers-reduced-motion: reduce)").matches){end();return}
  w.style.transition="transform 5.2s cubic-bezier(.12,.75,.12,1)";requestAnimationFrame(()=>{w.style.transform=`rotate(${deg}deg)`});setTimeout(end,5400)}

/* ---------- accueil ---------- */
function viewWelcome(rename,msg){return`<div class="welcome">${rename?`<div class="grab"><h3>Ton pseudo</h3><button class="x" data-act="close">${ic("x")}</button></div>${msg?`<p class="warn" style="text-align:left">${msg}</p>`:""}`:`
  <svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#13241c"/><path d="M6 31h8v-6h8v-6h8v-7" fill="none" stroke="#35d07f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 9l5 3-5 3" fill="none" stroke="#35d07f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="5" fill="#f2f6f3"/><path d="M12 9.8l2.5 1.8-1 3h-3l-1-3z" fill="#13241c"/></svg>
  <div class="big">D’amateur<br><em>à pro</em></div><p class="note" style="font-size:15px">Parie gratuitement sur les vrais matchs de foot, de rugby et de tennis, en direct. Fais monter ta carrière de la Départementale 4 à la Ligue des champions.</p>
  <div class="feat"><div>${ic("card","yc")}Cartons, corners, hors-jeux</div><div>${ic("posts")}Essais, pénalités ratées</div><div>${ic("broken")}Doubles fautes, raquettes cassées</div></div>`}
  <div class="form" style="text-align:left"><label>Ton pseudo<input id="w-name" maxlength="18" value="${esc(S.name)}" placeholder="ex. Le Pronostiqueur" autocomplete="nickname"></label>
  <p class="warn" id="w-err" hidden></p>
  <button class="btn gold wide" data-act="wgo">${rename?"Enregistrer":ic("coin")+" Recevoir mes 1 000 jetons"}</button></div>
  ${rename?"":STANDALONE?`<div class="info" style="text-align:left;margin-top:14px">${ic("info")}<span><b style="color:var(--ink)">Tu jouais déjà dans Safari ?</b> Récupère tes jetons et tes paris avec ton code.<br><button class="btn ghost" data-act="xfer" style="margin-top:8px">Entrer mon code</button></span></div>`
    :`<button class="link" data-act="xfer" style="margin-top:10px">J’ai déjà un compte (code de transfert)</button>`}
  ${rename?"":`<p class="note" style="margin-top:12px">Jetons fictifs, aucun argent réel. Jeu réservé au divertissement.</p>`}</div>`}
async function welcomeGo(){const inp=$("#w-name"),n=(inp.value||"").replace(/\s+/g," ").trim().slice(0,18),err=$("#w-err"),b=$("[data-act=wgo]");
  if(!n){inp.focus();return}const first=!S.name;b.disabled=true;err.hidden=true;
  const taken=()=>{err.hidden=false;err.textContent=`« ${n} » est déjà pris. Choisis un autre pseudo.`;b.disabled=false;inp.focus();inp.select()};
  try{if(first||!S.tok){const j=await api("session",{name:n,bal:S.bal,peak:S.peak,...myStats()});S.tok=j.token;S.pid=j.id}
    else{const j=await api("sync",{name:n,bal:S.bal,peak:S.peak,...myStats()});if(j.name_taken){taken();return}}}
  catch(e){if(e.code==="name_taken"){taken();return}}   // hors connexion : on accepte, la vérification se fera plus tard
  S.name=n;save();U.open=null;layer("");render();
  if(first){setTimeout(joinFromLink,400);toast(`${ic("coin")} 1 000 jetons offerts. À toi de jouer !`,"win");confetti()}else toast("Pseudo enregistré.","win")}

/* ---------- installer l'app / changer d'appareil ---------- */
const UA=navigator.userAgent,STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const IOS=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),ANDROID=/android/i.test(UA);
const IOS_SAFARI=IOS&&!/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Instagram|FBAN|FBAV|Snapchat/i.test(UA);
let installEvt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(GATE){renderGate();return}if(U.tab==="m"&&!U.open)render();if(U.open==="install")layer(viewInstall())});
addEventListener("appinstalled",()=>{installEvt=null;try{localStorage.setItem("dap.inst",String(Date.now()))}catch(e){}});
function installBanner(){if(STANDALONE||!(IOS||ANDROID))return"";let x=0;try{x=+localStorage.getItem("dap.inst")||0}catch(e){}if(Date.now()-x<3*DAY)return"";
  return`<div class="instb"><span class="ii"><img src="icon-180.png" alt=""></span><div><b>Installe l’app sur ton téléphone</b><small>En 2 étapes, sans passer par un store.</small></div>
    <button class="btn" data-act="install">Comment&nbsp;?</button><button class="x" data-act="instx" aria-label="Plus tard">${ic("x")}</button></div>`}
const SHARE_IOS=`<svg class="i" viewBox="0 0 24 24" style="color:#5fa8ff"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M6 10.5H5a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8.5a1 1 0 0 0-1-1h-1"/></svg>`;
const ADD_IOS=`<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`;
function viewInstall(gate){const head=gate?"":`<div class="grab"><h3>Installer l’app</h3><button class="x" data-act="close" aria-label="Fermer">${ic("x")}</button></div>`;
  if(IOS){const url=location.origin+location.pathname;
    return head+(IOS_SAFARI?"":`<div class="info">${ic("info")}<span><b style="color:var(--ink)">Ouvre d’abord ce lien dans Safari</b> : les autres navigateurs ne permettent pas toujours l’installation.<br><button class="btn ghost" style="margin-top:8px" data-act="copylink">Copier le lien</button></span></div>`)+
    `<p class="note">Tu as ouvert le lien depuis une autre appli (Messages, WhatsApp, Instagram…) ? Touche d’abord <b>Ouvrir dans Safari</b> (ou la boussole), puis :</p>
    <ol class="steps"><li><span class="n">1</span><div>Dans Safari, touche le bouton <b>Partager</b> ${SHARE_IOS}<small>Selon ta version d’iOS : dans la barre du bas, à côté de l’adresse, ou dans le menu <b>•••</b>.</small></div></li>
      <li><span class="n">2</span><div>Fais défiler et choisis <b>Sur l’écran d’accueil</b> ${ADD_IOS}, puis <b>Ajouter</b>.<small>Si l’option « Ouvrir comme app web » apparaît, laisse-la activée.</small></div></li>
      <li><span class="n">3</span><div>Ouvre <b>D’amateur à pro</b> depuis ton écran d’accueil et entre ton <b>code de transfert</b> : tu retrouves tes jetons, tes paris et tes ligues.<small>Sur iPhone, l’app installée ne voit pas ce que tu as fait dans Safari : le code fait le lien.</small></div></li></ol>
    <div class="xbox" id="xbox">${S.name?`<button class="btn gold wide" data-act="xmake">${ic("ticket")} Créer mon code de transfert</button>`:gate?`<p class="note">Nouveau joueur ? Pas besoin de code : tu choisiras ton pseudo dans l’app.</p>`:`<p class="note">Choisis d’abord un pseudo pour avoir un code.</p>`}</div>
`}
  if(ANDROID)return head+(installEvt?`<p class="note" style="font-size:15px">Un appui suffit : l’app s’ajoute à ton écran d’accueil, avec ton compte.</p><button class="btn gold wide" data-act="instgo">${ic("plus")} Installer l’app</button>`
    :`<ol class="steps"><li><span class="n">1</span><div>Dans Chrome, touche le menu <b>⋮</b> en haut à droite.</div></li>
      <li><span class="n">2</span><div>Choisis <b>Installer l’application</b> (ou <b>Ajouter à l’écran d’accueil</b>), puis confirme.</div></li>
      <li><span class="n">3</span><div>Ouvre <b>D’amateur à pro</b> depuis ton écran d’accueil : ton compte est déjà là.</div></li></ol>
      <p class="note">Sur un autre navigateur (Samsung Internet, Firefox…), l’option se trouve aussi dans le menu, sous « Ajouter à l’écran d’accueil ».</p>`);
  return head+`<p class="note">Ouvre ce site sur ton téléphone pour l’installer sur l’écran d’accueil.</p>`}
async function installPrompt(){if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice.catch(()=>null);installEvt=null;
  if(GATE){renderGate();if(r&&r.outcome==="accepted")toast("App installée ! Ouvre-la depuis ton écran d’accueil.","win");return}
  if(r&&r.outcome==="accepted"){closeLayer();toast("App installée ! Retrouve-la sur ton écran d’accueil.","win")}else layer(viewInstall())}
// Sur téléphone, le jeu ne s'utilise que depuis l'app installée (écran d'accueil) : dans un navigateur,
// on n'affiche que la marche à suivre (et le code de transfert pour ceux qui jouaient déjà ici).
const GATE=!STANDALONE&&!matchMedia("(display-mode: fullscreen), (display-mode: minimal-ui)").matches&&(IOS||ANDROID);
function renderGate(){const lg=new URLSearchParams(location.search).get("ligue");
  document.body.classList.add("gated");
  $("#main").innerHTML=`<div class="gate"><img src="icon-180.png" alt="" class="gicon">
    <h1>D’amateur <em>à pro</em></h1><small style="color:var(--mute2)">v${VERSION}</small><p class="gsub">Le jeu se joue <b>uniquement depuis l’app</b> sur ton écran d’accueil. C’est gratuit, sans store, et ça prend 10 secondes.</p>
    ${lg?`<div class="xcode" style="margin-bottom:12px"><small>Invitation à une ligue : une fois dans l’app, va dans Ligues › Rejoindre et entre ce code</small><b>${esc(lg.toUpperCase().slice(0,8))}</b></div>`:""}
    ${viewInstall(true)}</div>`}
// Code de transfert : on envoie tout l'état du jeu (sauf le jeton) au serveur, valable 48 h
async function transferOut(){const box=$("#xbox");if(box)box.innerHTML=`<div class="skel" style="height:70px"></div>`;
  try{if(!(await ensureSession()))throw{code:"offline"};await syncNow();const st={...S};delete st.tok;delete st.pid;
    const j=await api("make_transfer",{state:st});
    const html=`<div class="xcode"><small>Ton code de transfert (valable 48 h, une seule fois)</small><b>${esc(j.code)}</b>
      <button class="btn ghost" data-act="copycode" data-code="${esc(j.code)}">Copier</button></div>
      <p class="note">Entre-le dans l’app installée ou sur ton autre téléphone. Une fois utilisé, ce navigateur-ci est déconnecté du compte.</p>`;
    if($("#xbox"))$("#xbox").innerHTML=html}
  catch(e){if($("#xbox"))$("#xbox").innerHTML=`<p class="warn">Pas de connexion au serveur, réessaie dans un instant.</p><button class="btn gold wide" data-act="xmake">Réessayer</button>`}}
function viewTransferIn(){return`<div class="grab"><h3>Code de transfert</h3><button class="x" data-act="${S.name?"close":"xback"}" aria-label="Retour">${ic("x")}</button></div>
  <div class="form"><label>Ton code (8 caractères)<input id="x-code" maxlength="9" placeholder="ex. K7RZ-P3QA" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-weight:800;text-align:center;font-size:22px"></label>
  <p class="warn" id="x-err" hidden></p><button class="btn gold wide" data-act="xferok">Récupérer mon compte</button>
  <p class="note">Le code se crée dans l’ancien navigateur : Carrière › « Transférer mon compte », ou depuis « Installer l’app ».${S.name?" Attention : ce que tu as sur cet appareil sera remplacé.":""}</p></div>`}
async function transferIn(){const code=($("#x-code").value||"").trim(),err=$("#x-err"),b=$("[data-act=xferok]");if(code.replace(/[^a-z0-9]/gi,"").length<8){$("#x-code").focus();return}
  b.disabled=true;err.hidden=true;
  try{const j=await api("use_transfer",{code});const st=j.state&&typeof j.state==="object"?j.state:{};
    if(j.state&&typeof j.state==="object")S=Object.assign({v:2,name:"",bal:1000,peak:1000,bonus:"",bets:[],org:[],orgMode:false,sim:false},st,{tok:j.token,pid:j.id,name:j.name});
    else Object.assign(S,{tok:j.token,pid:j.id,name:j.name});   // code sans sauvegarde : on garde ce qu'il y a sur ce téléphone
    saveLocal();
    toast(`${ic("coin")} Compte récupéré : bon retour ${esc(j.name)} !`,"win");setTimeout(()=>location.reload(),900)}
  catch(e){b.disabled=false;err.hidden=false;err.textContent=e.code==="unknown"?"Code inconnu ou expiré (48 h). Crée un nouveau code dans l’ancien navigateur.":e.code==="slow_down"?"Trop d’essais : réessaie dans une heure.":"Pas de connexion au serveur."}}

/* ---------- version ----------
   Numéro affiché à côté du titre. version.txt (même numéro) permet à une app restée ouverte
   de voir qu'une mise à jour est sortie et de proposer de recharger. */
const VERSION="1.17";
function showVersion(){const v=$("#ver");if(!v)return;v.textContent="v"+VERSION;let last="";try{last=localStorage.getItem("dap.ver")||""}catch(e){}
  if(last&&last!==VERSION){v.classList.add("new");toast(`Mise à jour installée : version ${VERSION}`,"win");setTimeout(()=>v.classList.remove("new"),6000)}
  try{localStorage.setItem("dap.ver",VERSION)}catch(e){}}
async function checkUpdate(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&v!==VERSION&&!$(".upd")){const b=document.createElement("button");b.className="upd";b.innerHTML=`<span>Nouvelle version ${esc(v)} disponible</span><b>Recharger</b>`;
    b.onclick=()=>location.reload();document.body.appendChild(b)}}catch(e){}}
showVersion();checkUpdate();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});setInterval(checkUpdate,5*6e4);

/* ---------- démarrage ---------- */
if(GATE)renderGate();else{
render();
if(!S.name){U.open="welcome";layer(viewWelcome(false))}else{syncSoon();joinFromLink()}
loadFeeds();
setTimeout(()=>{if(S.name)loadBoards();if(S.duel&&Object.values(S.duel).some(x=>!x.settled))loadDuels()},3000);
setInterval(()=>{if(!document.hidden&&S.duel&&Object.values(S.duel).some(x=>!x.settled))loadDuels()},12e4);
setInterval(()=>{if(document.hidden)return;
  const anyLive=[...REG.values()].some(m=>m.src==="espn"&&m.state==="in");const stale=Object.values(FEED).some(f=>f.at&&Date.now()-f.at>(anyLive?6e4:5*6e4));
  if(stale){for(const sp in SP)for(const lv in SP[sp].feeds)if(FEED[sp+lv]&&Date.now()-FEED[sp+lv].at>(anyLive?6e4:5*6e4))loadFeed(sp,+lv).then(()=>{if(!U.open)render();settle()})}
  else if(!U.open)render();
  settle()},30000);
settle();
}
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
